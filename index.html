<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legisladores · Eutanasia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg2: #f5f5f3; --bg3: #eeede8;
      --text: #1a1a1a; --text2: #666; --text3: #999;
      --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
      --radius: 8px; --radius-lg: 12px;
      --favor: #1D9E75; --favor-bg: #E1F5EE; --favor-text: #0F6E56;
      --contra: #E24B4A; --contra-bg: #FCEBEB; --contra-text: #A32D2D;
      --inc: #BA7517; --inc-bg: #FAEEDA; --inc-text: #854F0B;
      --info: #378ADD; --info-bg: #E6F1FB; --info-text: #185FA5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a; --bg2: #242424; --bg3: #2e2e2e;
        --text: #f0f0f0; --text2: #aaa; --text3: #666;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); font-size: 14px; min-height: 100vh; }
    .app { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 8px; }
    .header h1 { font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 1.25rem; }
    .stat { background: var(--bg); border-radius: var(--radius); padding: .75rem 1rem; text-align: center; border: 0.5px solid var(--border); }
    .stat-n { font-size: 22px; font-weight: 500; display: block; }
    .stat-l { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .s-favor .stat-n { color: var(--favor); }
    .s-contra .stat-n { color: var(--contra); }
    .s-inc .stat-n { color: var(--inc); }
    .toolbar { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .toolbar input, .toolbar select { padding: 8px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 13px; background: var(--bg); color: var(--text); outline: none; }
    .toolbar input { flex: 1; min-width: 160px; }
    .btn { padding: 8px 14px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: none; cursor: pointer; font-size: 13px; font-family: inherit; color: var(--text); display: inline-flex; align-items: center; gap: 6px; transition: background .15s; }
    .btn:hover { background: var(--bg2); }
    .btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
    .btn-primary:hover { opacity: .85; background: var(--text); }
    .btn-sm { padding: 6px 11px; font-size: 12px; }
    .btn-danger { color: var(--contra); border-color: var(--contra); }
    .btn-danger:hover { background: var(--contra-bg); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; cursor: pointer; transition: border-color .15s; }
    .card:hover { border-color: var(--border2); }
    .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; flex-shrink: 0; }
    .av-f { background: var(--favor-bg); color: var(--favor-text); }
    .av-c { background: var(--contra-bg); color: var(--contra-text); }
    .av-i { background: var(--inc-bg); color: var(--inc-text); }
    .card-name { font-size: 13px; font-weight: 500; line-height: 1.3; }
    .card-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; margin-bottom: 7px; }
    .bf { background: var(--favor-bg); color: var(--favor-text); }
    .bc { background: var(--contra-bg); color: var(--contra-text); }
    .bi { background: var(--inc-bg); color: var(--inc-text); }
    .prob-row { display: flex; align-items: center; gap: 6px; }
    .prob-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
    .prob-fill { height: 100%; border-radius: 3px; }
    .prob-pct { font-size: 12px; font-weight: 500; min-width: 32px; text-align: right; }
    .card-meta { font-size: 11px; color: var(--text2); margin-top: 9px; padding-top: 9px; border-top: 0.5px solid var(--border); display: flex; flex-direction: column; gap: 3px; }
    .chip { display: inline-flex; align-items: center; gap: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .add-card { border-style: dashed; display: flex; align-items: center; justify-content: center; min-height: 170px; flex-direction: column; gap: 8px; color: var(--text2); }
    .add-card:hover { background: var(--bg2); }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
    .overlay.open { display: flex; }
    .modal { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border2); padding: 1.5rem; width: min(620px, 100%); margin: auto; }
    .modal-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-hdr h2 { font-size: 16px; font-weight: 500; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .fg { display: flex; flex-direction: column; gap: 4px; }
    .fg.full { grid-column: 1 / -1; }
    label { font-size: 12px; color: var(--text2); font-weight: 500; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 13px; font-family: inherit; background: var(--bg); color: var(--text); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--info); }
    textarea { resize: vertical; min-height: 68px; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; padding-top: 1rem; border-top: 0.5px solid var(--border); }
    .detail-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; flex-shrink: 0; }
    .prob-big { font-size: 30px; font-weight: 500; }
    .detail-actions { display: flex; gap: 8px; margin: 1rem 0; flex-wrap: wrap; }
    .df-row { display: flex; gap: 8px; padding: 7px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
    .df-row:last-child { border-bottom: none; }
    .df-key { color: var(--text2); min-width: 160px; flex-shrink: 0; font-size: 12px; }
    .ai-box { background: var(--bg2); border-radius: var(--radius); padding: 1rem; margin-top: 12px; font-size: 13px; line-height: 1.65; }
    .spinner { width: 15px; height: 15px; border: 2px solid var(--border2); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: var(--radius); font-size: 13px; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .loading-screen { display: flex; align-items: center; justify-content: center; min-height: 200px; color: var(--text2); gap: 10px; }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1><i class="ti ti-building-bank"></i> Legisladores · eutanasia</h1>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" onclick="exportCSV()"><i class="ti ti-download"></i> Exportar CSV</button>
      <button class="btn btn-primary btn-sm" onclick="openForm()"><i class="ti ti-plus"></i> Agregar</button>
    </div>
  </div>
  <div class="stats-row" id="stats"></div>
  <div class="toolbar">
    <input type="text" id="q" placeholder="Buscar por nombre, bloque, provincia..." oninput="renderGrid()">
    <select id="fCamara" onchange="renderGrid()">
      <option value="">Todas las cámaras</option>
      <option>Diputados</option>
      <option>Senadores</option>
    </select>
    <select id="fPos" onchange="renderGrid()">
      <option value="">Todas las posiciones</option>
      <option>A favor</option>
      <option>En contra</option>
      <option>Incierto/a</option>
    </select>
  </div>
  <div class="grid" id="grid">
    <div class="loading-screen"><div class="spinner"></div> Cargando datos...</div>
  </div>
</div>

<div class="overlay" id="formOverlay" onclick="if(event.target===this)closeForm()">
  <div class="modal">
    <div class="modal-hdr">
      <h2 id="formTitle">Agregar legislador</h2>
      <button class="btn btn-sm" onclick="closeForm()"><i class="ti ti-x"></i></button>
    </div>
    <div class="form-grid">
      <div class="fg"><label>Nombre y apellido *</label><input id="f-nombre" placeholder="Ej: María García"></div>
      <div class="fg"><label>Cámara</label>
        <select id="f-camara"><option value="">—</option><option>Diputados</option><option>Senadores</option></select>
      </div>
      <div class="fg"><label>Bloque / partido</label><input id="f-bloque" placeholder="Ej: Unión por la Patria"></div>
      <div class="fg"><label>Provincia</label><input id="f-prov" placeholder="Ej: Buenos Aires"></div>
      <div class="fg"><label>Profesión</label><input id="f-prof" placeholder="Ej: Médica"></div>
      <div class="fg"><label>Religión declarada</label><input id="f-rel" placeholder="Ej: Católica"></div>
      <div class="fg"><label>Posición conocida sobre eutanasia</label>
        <select id="f-pos"><option value="Incierto/a">Incierto/a</option><option value="A favor">A favor</option><option value="En contra">En contra</option></select>
      </div>
      <div class="fg"><label>Posición sobre aborto (IVE)</label>
        <select id="f-ive"><option value="">Desconocida</option><option value="A favor">A favor</option><option value="En contra">En contra</option><option value="Incierto/a">Incierto/a</option></select>
      </div>
      <div class="fg full"><label>Declaraciones públicas relevantes</label><textarea id="f-decl" placeholder="Entrevistas, tuits, discursos..."></textarea></div>
      <div class="fg full"><label>Notas propias</label><textarea id="f-notas" placeholder="Tus anotaciones personales"></textarea></div>
      <div class="fg full"><label>Links / fuentes (separados por coma)</label><input id="f-links" placeholder="https://..."></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeForm()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveleg()"><i class="ti ti-check"></i> Guardar</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal" id="detailModal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL = 'https://lwwsuzemxypsyeqotsue.supabase.co';
const SUPA_KEY = 'sb_publishable_XveX8gC1JULV6wbhtc8T0g_mZ0bVlTQ';
const ANTHROPIC_KEY = 'TU_API_KEY_DE_ANTHROPIC'; // reemplazá esto

let data = [], eid = null;

async function supaFetch(path, method='GET', body=null) {
  const opts = {
    method,
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : ''
    }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, opts);
  if (!res.ok) throw new Error(await res.text());
  return method === 'DELETE' ? null : res.json();
}

async function load() {
  try {
    data = await supaFetch('legisladores?select=*&order=created_at.asc');
    render();
  } catch(e) {
    document.getElementById('grid').innerHTML = `<div class="loading-screen" style="color:var(--contra)"><i class="ti ti-alert-circle"></i> Error al conectar con la base de datos.</div>`;
  }
}

function render() { renderStats(); renderGrid(); }

function renderStats() {
  const t=data.length, f=data.filter(d=>d.pos==='A favor').length,
        c=data.filter(d=>d.pos==='En contra').length, i=data.filter(d=>d.pos==='Incierto/a').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="stat-n">${t}</span><div class="stat-l">Total</div></div>
    <div class="stat s-favor"><span class="stat-n">${f}</span><div class="stat-l">A favor</div></div>
    <div class="stat s-contra"><span class="stat-n">${c}</span><div class="stat-l">En contra</div></div>
    <div class="stat s-inc"><span class="stat-n">${i}</span><div class="stat-l">Inciertos</div></div>`;
}

function filtered() {
  const q = (document.getElementById('q')?.value||'').toLowerCase();
  const fc = document.getElementById('fCamara')?.value||'';
  const fp = document.getElementById('fPos')?.value||'';
  return data.filter(d => {
    const mq = !q || [d.nombre,d.bloque,d.prov,d.camara].some(v=>(v||'').toLowerCase().includes(q));
    return mq && (!fc||d.camara===fc) && (!fp||d.pos===fp);
  });
}

function avColor(pos) { return pos==='A favor'?'av-f':pos==='En contra'?'av-c':'av-i'; }
function badgeClass(pos) { return pos==='A favor'?'bf':pos==='En contra'?'bc':'bi'; }
function probColor(p) { return p>=60?'var(--favor)':p<=40?'var(--contra)':'var(--inc)'; }
function initials(n) { return (n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

function renderGrid() {
  const list = filtered();
  const g = document.getElementById('grid');
  if (!list.length && !data.length) {
    g.innerHTML = `<div class="card add-card" onclick="openForm()"><i class="ti ti-plus" style="font-size:28px;opacity:.35"></i><span style="font-size:13px">Agregar el primer legislador</span></div>`;
    return;
  }
  const cards = list.map(d => {
    const p = d.prob ?? 50;
    const pc = probColor(p);
    return `<div class="card" onclick="openDetail(${d.id})">
      <div class="card-top">
        <div class="avatar ${avColor(d.pos)}">${initials(d.nombre)}</div>
        <div><div class="card-name">${d.nombre||'—'}</div><div class="card-sub">${[d.camara,d.prov].filter(Boolean).join(' · ')||'Sin datos'}</div></div>
      </div>
      <span class="badge ${badgeClass(d.pos)}">${d.pos||'Incierto/a'}</span>
      <div class="prob-row">
        <div class="prob-bar"><div class="prob-fill" style="width:${p}%;background:${pc}"></div></div>
        <span class="prob-pct" style="color:${pc}">${p}%</span>
      </div>
      <div class="card-meta">
        ${d.bloque?`<span class="chip"><i class="ti ti-building" style="font-size:11px"></i> ${d.bloque}</span>`:''}
        ${d.prof?`<span class="chip"><i class="ti ti-briefcase" style="font-size:11px"></i> ${d.prof}</span>`:''}
        ${d.ive?`<span class="chip"><i class="ti ti-clipboard" style="font-size:11px"></i> Aborto: ${d.ive}</span>`:''}
      </div>
    </div>`;
  }).join('');
  const addBtn = `<div class="card add-card" onclick="openForm()"><i class="ti ti-plus" style="font-size:24px;opacity:.35"></i><span style="font-size:13px">Agregar</span></div>`;
  g.innerHTML = cards + addBtn;
}

function calcProb(d) {
  if (d.pos==='A favor') return 90;
  if (d.pos==='En contra') return 10;
  let s = 50;
  if (d.ive==='A favor') s+=15; if (d.ive==='En contra') s-=15;
  const bl = (d.bloque||'').toLowerCase();
  ['union por la patria','frente de todos','izquierda','socialismo','pj','peronismo'].forEach(b=>{if(bl.includes(b))s+=8;});
  ['pro','la libertad avanza'].forEach(b=>{if(bl.includes(b))s-=10;});
  const rl = (d.rel||'').toLowerCase();
  if (rl.includes('catoli')||rl.includes('evangeli')) s-=12;
  if (rl.includes('agnosti')||rl.includes('ateo')) s+=8;
  const pr = (d.prof||'').toLowerCase();
  if (pr.includes('medic')||pr.includes('enfermer')) s+=6;
  const dc = (d.decl||'').toLowerCase();
  ['muerte digna','autonomia','calidad de vida','eutanasia'].forEach(w=>{if(dc.includes(w))s+=5;});
  ['santidad','dios','moral','etica medica'].forEach(w=>{if(dc.includes(w))s-=4;});
  return Math.min(95, Math.max(5, Math.round(s)));
}

function openForm(id=null) {
  eid = id;
  document.getElementById('formTitle').textContent = id ? 'Editar legislador' : 'Agregar legislador';
  const d = id ? data.find(x=>x.id===id) : {};
  ['nombre','camara','bloque','prov','prof','rel','decl','notas','links'].forEach(f => {
    document.getElementById('f-'+f).value = d[f]||'';
  });
  document.getElementById('f-pos').value = d.pos||'Incierto/a';
  document.getElementById('f-ive').value = d.ive||'';
  document.getElementById('formOverlay').classList.add('open');
}
function closeForm() { document.getElementById('formOverlay').classList.remove('open'); }

async function saveleg() {
  const nombre = document.getElementById('f-nombre').value.trim();
  if (!nombre) { alert('El nombre es obligatorio.'); return; }
  const d = {
    nombre, camara: document.getElementById('f-camara').value,
    bloque: document.getElementById('f-bloque').value,
    prov: document.getElementById('f-prov').value,
    prof: document.getElementById('f-prof').value,
    rel: document.getElementById('f-rel').value,
    pos: document.getElementById('f-pos').value,
    ive: document.getElementById('f-ive').value,
    decl: document.getElementById('f-decl').value,
    notas: document.getElementById('f-notas').value,
    links: document.getElementById('f-links').value,
    prob: null
  };
  d.prob = calcProb(d);
  try {
    if (eid) {
      const updated = await supaFetch(`legisladores?id=eq.${eid}`, 'PATCH', d);
      const idx = data.findIndex(x=>x.id===eid);
      if (idx>=0) data[idx] = {...data[idx], ...d};
    } else {
      const created = await supaFetch('legisladores', 'POST', d);
      data.push(Array.isArray(created) ? created[0] : created);
    }
    closeForm(); render(); toast('Guardado correctamente');
  } catch(e) { alert('Error al guardar: ' + e.message); }
}

async function deleteLeg(id) {
  if (!confirm('¿Eliminás este legislador?')) return;
  try {
    await supaFetch(`legisladores?id=eq.${id}`, 'DELETE');
    data = data.filter(d=>d.id!==id);
    closeDetail(); render(); toast('Eliminado');
  } catch(e) { alert('Error al eliminar'); }
}

function openDetail(id) {
  const d = data.find(x=>x.id===id); if (!d) return;
  const p = d.prob ?? 50; const pc = probColor(p);
  const fields = [
    ['Cámara',d.camara],['Bloque / partido',d.bloque],['Provincia',d.prov],
    ['Profesión',d.prof],['Religión declarada',d.rel],
    ['Posición sobre eutanasia',d.pos],['Posición sobre aborto (IVE)',d.ive],
    ['Declaraciones públicas',d.decl],['Notas propias',d.notas],['Links / fuentes',d.links]
  ].filter(r=>r[1]);
  const rows = fields.map(([k,v])=>`<div class="df-row"><span class="df-key">${k}</span><span>${k==='Links / fuentes'?v.split(',').map(l=>`<a href="${l.trim()}" target="_blank" style="color:var(--info-text)">${l.trim()}</a>`).join(', '):v}</span></div>`).join('');
  const aiSection = d.ai_analysis ? `<div class="ai-box"><p style="font-size:11px;color:var(--text2);margin-bottom:6px">Último análisis IA · ${new Date(d.ai_updated_at).toLocaleString('es-AR')}</p><p style="white-space:pre-wrap">${d.ai_analysis}</p></div>` : '';
  document.getElementById('detailModal').innerHTML = `
    <div class="modal-hdr">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="detail-avatar ${avColor(d.pos)}">${initials(d.nombre)}</div>
        <div>
          <p style="font-size:16px;font-weight:500">${d.nombre}</p>
          <p style="font-size:12px;color:var(--text2)">${[d.camara,d.prov].filter(Boolean).join(' · ')||''}</p>
        </div>
      </div>
      <button class="btn btn-sm" onclick="closeDetail()"><i class="ti ti-x"></i></button>
    </div>
    <div style="display:flex;align-items:baseline;gap:10px;margin:1rem 0 .5rem">
      <span class="prob-big" style="color:${pc}">${p}%</span>
      <span style="font-size:13px;color:var(--text2)">probabilidad a favor</span>
      <span class="badge ${badgeClass(d.pos)}" style="margin:0">${d.pos}</span>
    </div>
    <div class="detail-actions">
      <button class="btn btn-primary btn-sm" onclick="analyzeAI(${id})"><i class="ti ti-sparkles"></i> Analizar con IA + internet</button>
      <button class="btn btn-sm" onclick="closeDetail();openForm(${id})"><i class="ti ti-edit"></i> Editar</button>
      <button class="btn btn-sm btn-danger" onclick="deleteLeg(${id})"><i class="ti ti-trash"></i> Eliminar</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:0">${rows||'<p style="color:var(--text2);font-size:13px;padding:.5rem 0">Sin datos cargados.</p>'}</div>
    <div id="aiResult"></div>
    ${aiSection}
  `;
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }

async function analyzeAI(id) {
  const d = data.find(x=>x.id===id); if (!d) return;
  const box = document.getElementById('aiResult');
  box.innerHTML = `<div class="ai-box" style="display:flex;align-items:center;gap:10px"><div class="spinner"></div><span style="color:var(--text2)">Buscando información y analizando...</span></div>`;
  const prompt = `Sos un analista político argentino especializado en el Congreso Nacional.
Estimá la probabilidad individual (%) de que el siguiente legislador vote A FAVOR de una ley de eutanasia o muerte digna en Argentina.

Datos:
- Nombre: ${d.nombre}
- Cámara: ${d.camara||'desconocida'}
- Bloque/partido: ${d.bloque||'desconocido'}
- Provincia: ${d.prov||'desconocida'}
- Profesión: ${d.prof||'desconocida'}
- Religión: ${d.rel||'desconocida'}
- Posición sobre eutanasia: ${d.pos}
- Posición sobre aborto (IVE): ${d.ive||'desconocida'}
- Declaraciones: ${d.decl||'ninguna'}
- Notas: ${d.notas||'ninguna'}

Buscá información adicional sobre este legislador en internet y respondé con este formato exacto:

PROBABILIDAD: X%
FACTORES A FAVOR: (máx 3 puntos)
FACTORES EN CONTRA: (máx 3 puntos)
INFO NUEVA ENCONTRADA: (declaraciones o datos relevantes no incluidos arriba)
INCERTIDUMBRE: alto/medio/bajo — (motivo)

Máximo 250 palabras. En español. Sin markdown.`;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': ANTHROPIC_KEY, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 1000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const json = await res.json();
    const text = json.content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    const newProb = extractProb(text, d.prob);
    await supaFetch(`legisladores?id=eq.${id}`, 'PATCH', {
      ai_analysis: text, ai_updated_at: new Date().toISOString(), prob: newProb
    });
    const idx = data.findIndex(x=>x.id===id);
    if (idx>=0) { data[idx].ai_analysis=text; data[idx].ai_updated_at=new Date().toISOString(); data[idx].prob=newProb; }
    render();
    const pc = probColor(newProb);
    box.innerHTML = `<div class="ai-box">
      <p style="font-size:11px;color:var(--text2);margin-bottom:8px">Análisis IA · ${new Date().toLocaleString('es-AR')} · Prob. actualizada: <strong style="color:${pc}">${newProb}%</strong></p>
      <p style="white-space:pre-wrap;font-size:13px;line-height:1.65">${text}</p>
    </div>`;
  } catch(e) {
    box.innerHTML = `<div class="ai-box"><span style="color:var(--contra)">Error al conectar con la IA. Revisá la API key de Anthropic en el código.</span></div>`;
  }
}

function extractProb(text, fallback) {
  const m = text.match(/PROBABILIDAD[:\s]+(\d{1,3})\s*%/i);
  if (m) return Math.min(95, Math.max(5, parseInt(m[1])));
  const all = [...(text.matchAll(/(\d{1,3})\s*%/g))].map(m=>parseInt(m[1])).filter(n=>n>=5&&n<=95);
  return all.length ? all[0] : fallback;
}

function exportCSV() {
  const h = ['Nombre','Cámara','Bloque','Provincia','Profesión','Religión','Posición eutanasia','Posición aborto','Prob. a favor %','Declaraciones','Notas','Links','Análisis IA'];
  const rows = data.map(d => [d.nombre,d.camara,d.bloque,d.prov,d.prof,d.rel,d.pos,d.ive,d.prob,d.decl,d.notas,d.links,d.ai_analysis].map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`));
  const csv = [h,...rows].map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'legisladores_eutanasia.csv'; a.click();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

load();
</script>
